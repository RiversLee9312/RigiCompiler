# CI：每次提交 / Pull Request 在 Windows/Linux 双平台（均 amd64 最新镜像）
# 执行 NativeAOT 发布，并用发布产物跑全量测试（任意失败非零退出码，CI 即失败）。
# 注意：NativeAOT 不支持跨 OS 交叉编译，故按平台分别发布（见 docs/agent_guide/development.md §2.3）。
name: build-and-test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # amd64 Windows 最新镜像（自带 VS C++ 工具链，AOT 前置满足）
            rid: win-x64
            exe: rigic.exe
            test-exe: RigiCompiler.Tests.exe
          - os: ubuntu-latest    # amd64 Ubuntu LTS 最新镜像
            rid: linux-x64
            exe: rigic
            test-exe: RigiCompiler.Tests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # 双平台统一 bash（Windows 侧由 Git Bash 提供）
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NativeAOT Linux 前置：clang + zlib 开发包（Windows 镜像自带 C++ 工具链，无需处理）
      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # libuv 静态库缓存（MW11b 事件底座；runner 预装 cmake，双平台同一脚本，
      # pwsh 为 GitHub Actions 内建 shell）。须在 publish 之前：NativeE2E 的
      # --out 用例链接时经 LibuvResolver 命中 tools/.libuv/<rid>/
      - name: Fetch libuv static lib (${{ matrix.rid }})
        shell: pwsh
        run: tools/Fetch-Libuv.ps1 -Rid ${{ matrix.rid }}

      # mimalloc 静态库缓存（GC Phase 2：rigi_rt track 台账的底层分配面；
      # 官方预编译包钉版预取，秒级完成）。须在 publish 之前：NativeE2E 的
      # --out 用例链接时经 MimallocResolver 命中 tools/.mimalloc/<rid>/
      - name: Fetch mimalloc static lib (${{ matrix.rid }})
        shell: pwsh
        run: tools/Fetch-Mimalloc.ps1 -Rid ${{ matrix.rid }}

      - name: Publish NativeAOT (${{ matrix.rid }})
        run: dotnet publish RigiCompiler.csproj -c Release -r ${{ matrix.rid }} -o publish

      # 用 AOT 发布产物跑既有全量门禁；语料随 publish 分发，与 checkout/CWD 无关
      - name: Run all tests (AOT binary)
        env:
          RIGI_TEST_RIGIC: ${{ github.workspace }}/publish/${{ matrix.exe }}
          RIGI_TEST_CORPUS_ONLY_OUTPUT: '1'
        run: ./publish/${{ matrix.exe }} test --all

      # 与 legacy 全量串行，避免两个不共享预算的测试宿主叠加。
      - name: Run TUnit pilot, budget and scheduling contracts
        env:
          RIGI_TEST_RIGIC: ${{ github.workspace }}/publish/${{ matrix.exe }}
          RIGI_TEST_CORPUS_ONLY_OUTPUT: '1'
        run: dotnet test --project Tests/TUnit/RigiCompiler.Tests.csproj --minimum-expected-tests 37 --report-trx --results-directory TestResults --report-trx-filename pilot.trx

      - name: Publish TUnit NativeAOT (${{ matrix.rid }})
        run: dotnet publish Tests/TUnit/RigiCompiler.Tests.csproj -c Release -r ${{ matrix.rid }} -o publish-tests

      - name: Run closed generic discovery (AOT test host)
        run: ./publish-tests/${{ matrix.test-exe }} --treenode-filter '/*/*/*/*[Category=Generic]' --minimum-expected-tests 1 --report-trx --results-directory TestResults --report-trx-filename generic-aot.trx
